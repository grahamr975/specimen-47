<script>
const log = []; let corpseFails = 0, orbsLeft = 0, sealFails = 0;

const check = (name, ok) => log.push((ok ? 'OK   ' : 'FAIL ') + name);
function autoMenu() {
  let guard = 0;
  while (game.menu && guard++ < 10) {
    const m = game.menu;
    m.t = 1; m.stageT = 1;
    menus++;
    render();
    Input.pressed.add(String(randInt(1, m.choices.length)));
    update(1 / 60); Input.endFrame();
  }
}
function step(n, god) {
  for (let i = 0; i < n; i++) {
    if (god && game.player) game.player.hp = game.player.maxHp;
    Input.keys.clear();
    if (game.state === 'play' && !game.menu && evolveReady(game.player) && !game.room.locked) Input.keys.add('f'); // cocoon once it's safe
    else if (game.state === 'play' && !game.menu) {
      const p = game.player;
      const e = game.enemies.filter(e => e.spawnT <= 0).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0];
      if (e) {
        Input.mouse.x = e.x; Input.mouse.y = e.y + ROOM_Y;
        // melee builds walk toward their prey
        const melee = !p.stats.guns.length, dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
        if (melee && d > 14) { if (dx > 3) Input.keys.add('d'); if (dx < -3) Input.keys.add('a'); if (dy > 3) Input.keys.add('s'); if (dy < -3) Input.keys.add('w'); }
        else { const dirs = [['w'], ['a'], ['s'], ['d']]; for (const k of dirs[Math.floor(game.time) % 4]) Input.keys.add(k); }
      }
      // Charge builds let go now and then so the blast fires.
      Input.mouse.down = !(p.stats.charge && Math.floor(game.time * 1.5) % 2);
      if (Math.random() < 0.02) Input.pressed.add(' ');
      if (Math.random() < 0.03) Input.mouse.rightClicked = true;
    }
    if (game.state === 'dead' || game.state === 'title') Input.mouse.clicked = game.overT > 1.2 || game.state === 'title';
    update(1 / 60);
    if (i % 7 === 0) render();
    Input.endFrame();
    autoMenu();
  }
}
const combatRoom = () => { enterRoom(game.floor.rooms.find(r => r.type === 'combat') || game.floor.rooms[1], 'up'); };
// The path from a root down to `id`.
function pathTo(id) { const out = [id]; while (MUTATIONS[out[0]].from) out.unshift(MUTATIONS[out[0]].from); return out; }
// Grow the given nodes (each with its whole path). MOUTH keeps the starter slime blob unless given.
function grow(p, ...ids) {
  p.slots = { MOUTH: { id: 'slime', path: ['slime'], starter: true }, HEAD: null, BACK: null, LIMBS: null, CORE: null };
  for (const id of ids) { const path = pathTo(id); p.slots[slotOf(id)] = { id, path }; }
  recomputeStats(p);
}
const leaves = () => Object.keys(MUTATIONS).filter(id => !MUTATIONS[id].part && !childrenOf(id).length);

  p.inv = 0; hurtPlayer(1); check('limb wear after a hit', p.limbWear > 0 && movement(p).slug);
  check('torn legs vanish (you are a slug again)', !p.legs || (update(1 / 60), Input.endFrame(), !p.legs));
  newRun(); combatRoom(); p = game.player; grow(p, 'wings', 'secondheart'); p.evolutions = 8; recomputeStats(p);
  p.hp = 1; p.inv = 0; hurtPlayer(1); check('second heart: reborn limbless & pure (stage ' + p.stage + ')', game.state === 'play' && !p.slots.LIMBS && p.stage <= 1);
  newRun(); combatRoom(); p = game.player; grow(p);
  for (let i = 0; i < 60; i++) { Input.keys.clear(); Input.keys.add('d'); update(1 / 60); Input.endFrame(); }
  check('slug leaves slime terrain (' + game.room.slime.length + ')', game.room.slime.length > 5);
  // Bone Cage: every third hit glances off.
  newRun(); combatRoom(); p = game.player; grow(p, 'bonecage'); const hc = p.hp;
  for (let i = 0; i < 3; i++) { p.inv = 0; p.limbWear = 0; hurtPlayer(1); }
  check(`bone cage: 3 hits cost 2 health (${hc} -> ${p.hp})`, p.hp === hc - 2);
  // Juggernaut: rammed enemies get launched.
  newRun(); combatRoom(); p = game.player; game.enemies = []; grow(p, 'juggernaut');
  let r = dummy(8); p.dashCd = 0; p.aimX = 1; p.aimY = 0; Input.pressed.add(' '); update(1 / 60); Input.endFrame();
  for (let i = 0; i < 6 && !r.thrown; i++) { update(1 / 60); Input.endFrame(); }
  check('juggernaut launches what it rams', !!r.thrown || r.dead);
  // Acid Maw: what you bite bursts into bile when it dies.
  newRun(); combatRoom(); p = game.player; game.enemies = []; game.puddles = []; grow(p, 'acidmaw');
  r = dummy(12); p.aimX = 1; p.aimY = 0; fireFor(1); damageEnemy(r, 999, 0, 0, true);
  check('acid maw: bitten victim bursts into bile', r.acidMarked && game.puddles.some(pd => pd.team === 'player' && pd.r >= 16));
  // Devour: a badly wounded enemy is swallowed whole.
  newRun(); combatRoom(); p = game.player; game.enemies = []; grow(p, 'devour');
  r = dummy(12, 99); r.hp = 30; p.aimX = 1; p.aimY = 0; fireFor(1);
  check('devour swallows a wounded enemy whole', r.dead);
  // Urchin Hide: a touch sets off the ring.
  newRun(); combatRoom(); p = game.player; game.enemies = []; game.bullets = []; grow(p, 'seekquills');
  r = dummy(0); r.speed = 0; p.inv = 1; update(1 / 60); Input.endFrame();
  check(`urchin hide: a touch sets off your shard ring (${(99 - r.hp).toFixed(1)} dmg, thorns alone ${p.stats.thorns})`, 99 - r.hp > p.stats.thorns + 1);
  // Fight or Flight slows the world.
  newRun(); combatRoom(); p = game.player; grow(p, 'fightflight'); p.inv = 0; hurtPlayer(1);
  check('fight or flight slows the world', game.slowT > 1);

  // Cures.
  newRun(); p = game.player;
  grow(p, 'overgrown'); const hpBad = p.maxHp; check('overgrown heart is malignant', p.stage >= 1);
  grow(p, 'titanheart'); check(`titan heart cures it (maxHp ${hpBad} -> ${p.maxHp}, dmg x${p.stats.damageMul.toFixed(2)})`, p.maxHp > hpBad && !slotMalignant(p.slots.CORE));
  grow(p, 'hollow'); check('hollow body keeps the slot malignant', slotMalignant(p.slots.CORE));
  grow(p, 'antennae'); check(`owl eyes restore the light (lightMul ${p.stats.lightMul.toFixed(2)}, nightEyes ${p.stats.nightEyes.toFixed(2)})`, Math.abs(p.stats.lightMul - 1) < 0.01 && p.stats.nightEyes > 0.5);

  // 3) Evolution flow stress: 150 level-ups with random choices.
  newRun(); combatRoom(); game.enemies = []; // a cleared room: safe to cocoon
  for (let i = 0; i < 150; i++) game.pendingEvolutions.push(i % 30 === 0 ? { slot: 'CORE' } : {}); // (a few devoured cores)
  for (let i = 0; i < 3000 && (evolveReady(game.player) || game.menu); i++) step(1, true);
  p = game.player;
  log.push(`after 150 evolutions: ${SLOTS.map(s => s + '=' + (p.slots[s] ? p.slots[s].path.join('>') : '-')).join(' ')}`);
  check(`every slot grew, and nothing is stuck (menus=${menus})`, SLOTS.every(s => p.slots[s] && !p.slots[s].starter) && !evolveReady(p) && !game.menu);

  // 4) Full god-mode runs.
  for (let run = 0; run < 3; run++) {
    newRun();
    let frames = 0, lockedFor = 0;
    while (frames < 40000 && game.depth < 5) {
      step(30, true); frames += 30;
      const room = game.room;
      if (room.locked) { lockedFor += 30; if (lockedFor > 1800) for (const e of game.enemies.slice()) damageEnemy(e, 999, 0, 0, true); continue; }
      lockedFor = 0;
      for (const c of room.corpses.slice()) {
        const p = game.player; p.x = clamp(c.x - (p.stats.guns.length ? 22 : 9), TILE + 6, ROOM_PX_W - TILE - 6); p.y = c.y;
        for (let k = 0; k < 150 && !c.dead; k++) { Input.keys.clear(); Input.mouse.x = c.x; Input.mouse.y = c.y + ROOM_Y; Input.mouse.down = !(p.stats.charge && k % 40 > 30); p.hp = p.maxHp; update(1 / 60); Input.endFrame(); autoMenu(); }
        if (!c.dead) corpseFails++;
      }
      for (const o of room.orbs.slice()) { game.player.x = o.x; game.player.y = o.y; step(20, true); }
      orbsLeft += room.orbs.length;
      for (const pk of room.pickups.slice()) { game.player.x = pk.x; game.player.y = pk.y; step(3, true); }
      if (room.hatch) { game.player.x = ROOM_PX_W / 2; game.player.y = ROOM_PX_H / 2; step(2, true); continue; }
      // A hazmat seal: walk up to it and attack until it breaks.
      for (const d in room.seals || {}) {
        if (!sealAt(room, d)) continue;
        const c = doorCenter(d), p = game.player;
        const sx = clamp(c.x, TILE + 8, ROOM_PX_W - TILE - 8), sy = clamp(c.y, TILE + 8, ROOM_PX_H - TILE - 8);
        // Hold position next to it, as a player would.
        for (let k = 0; k < 600 && sealAt(room, d); k++) { p.x = sx; p.y = sy; p.mvx = p.mvy = 0; Input.keys.clear(); Input.mouse.x = c.x; Input.mouse.y = c.y + ROOM_Y; Input.mouse.down = !(p.stats.charge && k % 40 > 30); p.hp = p.maxHp; update(1 / 60); Input.endFrame(); autoMenu(); }
        if (sealAt(room, d)) { sealFails++; log.push(`seal held vs ${SLOTS.map(sl => p.slots[sl] ? p.slots[sl].path.join('>') : '-').join(' | ')} (door ${d}, hits ${room.seals[d].hits}, pos ${p.x.toFixed(0)},${p.y.toFixed(0)}, control ${p.controlT > 0}, withdrawn ${p.withdrawn})`); }
      }
      const names = Object.keys(room.doors), unv = names.filter(n => !room.doors[n].visited);
      const dir = unv.length ? pick(unv) : pick(names);
      const spots = { up: [160, 15], down: [160, 177], left: [15, 96], right: [305, 96] };
      game.player.x = spots[dir][0]; game.player.y = spots[dir][1];
      Input.keys.clear(); Input.keys.add(dir === 'up' ? 'w' : dir === 'down' ? 's' : dir === 'left' ? 'a' : 'd');
      update(1 / 60); update(1 / 60);
      const exitRoom = game.floor.rooms.find(r => r.type === 'exit');
      if (exitRoom.visited && exitRoom.cleared && !unv.length) enterRoom(exitRoom, 'up');
    }
    p = game.player;
    log.push(`run ${run}: depth ${game.depth}, kills ${game.kills}, level ${p.level}, ${SLOTS.map(s => s + '=' + (p.slots[s] ? p.slots[s].id : '-')).join(' ')}`);
  }

  log.push('corpse burst failures=' + corpseFails + ' orbs left uncollected=' + orbsLeft);
  check(`the bot broke every hazmat seal it met (${sealFails} failed)`, sealFails === 0);
  // 5) Second heart + death + restart.
  newRun(); combatRoom(); p = game.player;
  grow(p, 'secondheart');
  p.hp = 1; p.inv = 0; hurtPlayer(1);
  log.push('second heart: state=' + game.state + ' hp=' + p.hp);
  p.inv = 0; p.hp = 1; hurtPlayer(1);
  log.push('then: state=' + game.state);
  step(200, false);
  log.push('after restart: state=' + game.state + ' mouth=' + game.player.slots.MOUTH.id);
} catch (e) { log.push('EXCEPTION ' + e.message + '\n' + e.stack); }
document.getElementById('out').textContent = log.concat(window.__errs).join('\n');
</script>
</body></html>
